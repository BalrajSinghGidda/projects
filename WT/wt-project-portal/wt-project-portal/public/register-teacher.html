<div class="row">
    <div class="col s12">
        <h2>Register a Teacher</h2>
        <form id="register-teacher-form">
            <div class="input-field">
                <input type="text" id="teacher-username" required>
                <label for="teacher-username">Teacher Username</label>
            </div>
            <div class="input-field">
                <input type="password" id="teacher-password" required>
                <label for="teacher-password">Password</label>
            </div>
            <button class="btn waves-effect waves-light" type="submit">Register Teacher
                <i class="material-icons right">person_add</i>
            </button>
        </form>
    </div>
</div>
