<div class="row">
    <div class="col s12">
        <h2>Register a Student</h2>
        <form id="register-student-form">
            <div class="input-field">
                <input type="text" id="student-username" required>
                <label for="student-username">Student Username</label>
            </div>
            <div class="input-field">
                <input type="password" id="student-password" required>
                <label for="student-password">Password</label>
            </div>
            <button class="btn waves-effect waves-light" type="submit">Register Student
                <i class="material-icons right">person_add</i>
            </button>
        </form>
    </div>
</div>
