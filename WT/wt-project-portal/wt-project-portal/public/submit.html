<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Project - Project Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-wrapper">
            <a href="/" class="brand-logo">Project Portal</a>
            <a href="#" data-target="mobile-nav" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down" id="nav-links">
            </ul>
        </div>
    </nav>
    <ul class="sidenav" id="mobile-nav">
    </ul>
    <main class="container">
        <h2>Submit a Project</h2>
        <form id="project-form" enctype="multipart/form-data">
            <div class="input-field">
                <select id="assignment-select" name="assignment_id" required></select>
                <label>Select Assignment</label>
            </div>
            <div class="input-field">
                <input type="text" id="project-title" name="title" required>
                <label for="project-title">Project Title</label>
            </div>
            <div class="input-field">
                <input type="url" id="project-link" name="link">
                <label for="project-link">Project Link (e.g., Google Drive, GitHub)</label>
            </div>
            <div class="file-field input-field">
                <div class="btn">
                    <span>File</span>
                    <input type="file" name="projectFile" id="project-file">
                </div>
                <div class="file-path-wrapper">
                    <input class="file-path validate" type="text" placeholder="Upload one or more files">
                </div>
            </div>
            <button class="btn waves-effect waves-light" type="submit" name="action">Submit
                <i class="material-icons right">send</i>
            </button>
        </form>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
