<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Viva - Project Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-wrapper">
            <a href="/" class="brand-logo">Project Portal</a>
            <a href="#" data-target="mobile-nav" class="sidenav-trigger"><i class="material-icons">menu</i></a>
            <ul class="right hide-on-med-and-down" id="nav-links">
            </ul>
        </div>
    </nav>
    <ul class="sidenav" id="mobile-nav">
    </ul>
    <main class="container">
        <h2>Schedule a Viva</h2>
        <form id="schedule-viva-form">
            <div class="input-field">
                <select id="project-select" required></select>
                <label>Select Project</label>
            </div>
            <div class="input-field">
                <input type="text" class="datepicker" id="viva-date" required>
                <label for="viva-date">Viva Date</label>
            </div>
            <button class="btn waves-effect waves-light" type="submit" name="action">Schedule
                <i class="material-icons right">send</i>
            </button>
        </form>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
