<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Dashboard - WT Portal</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="role-teacher">
  <nav>
    <a class="active" href="/pages/teacher-dashboard.html">Dashboard</a>
    <a href="/pages/teacher-users.html">Users</a>
    <a href="/pages/project.html">Projects & Members</a>
    <a href="/pages/notifications.html">Notifications</a>
    <a href="/pages/absence.html">Absence</a>
    <span class="role-badge">TEACHER PORTAL</span>
    <button onclick="logout()">Logout</button>
  </nav>

  <div class="container">
    <section class="page-header">
      <h2 class="page-title">Teacher Command Center</h2>
    </section>

    <section class="kpi-grid" id="teacher-kpi-grid">
      <div class="kpi-card">
        <span class="kpi-value" id="teacher-kpi-total">-</span>
        <span class="kpi-label">Projects</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-value" id="teacher-kpi-pending">-</span>
        <span class="kpi-label">Pending Absences</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-value" id="teacher-kpi-deadlines">-</span>
        <span class="kpi-label">Open Deadlines</span>
      </div>
    </section>

    <div class="panel">
      <div class="actions">
        <button onclick="loadAllProjects()">All Projects</button>
        <button onclick="loadAbsences()">Absence Queue</button>
        <button onclick="loadDashboardStats()">Refresh KPIs</button>
      </div>
      <div id="output"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
