<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications - NexusEdu</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav>
    <a href="/pages/dashboard.html">Dashboard</a>
    <a href="/pages/project.html">Projects</a>
    <a href="/pages/notifications.html">Notifications</a>
    <a href="/pages/absence.html">Absence</a>
    <button onclick="logout()">Logout</button>
  </nav>

  <div class="container">
    <section class="page-header">
      <h2 class="page-title">Notifications Hub</h2>
    </section>

    <section class="dashboard-grid">
      <div class="panel" id="notification-form">
        <h3 class="panel-title">Send Notification (Teacher/Admin)</h3>
        <input id="ntitle" placeholder="Title">
        <input id="nmsg" placeholder="Message">
        <button onclick="sendNotification()">Send</button>
      </div>
    </section>

    <div class="panel">
      <h3 class="panel-title">Notifications History</h3>
      <div id="notifications-list"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
