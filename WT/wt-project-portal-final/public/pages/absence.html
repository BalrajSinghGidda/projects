<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absence - NexusEdu</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav>
    <a href="/pages/dashboard.html">Dashboard</a>
    <a href="/pages/project.html">Projects</a>
    <a href="/pages/notifications.html">Notifications</a>
    <a href="/pages/absence.html">Absence</a>
    <button onclick="logout()">Logout</button>
  </nav>

  <div class="container">
    <section class="page-header">
      <h2 class="page-title">Absence Center</h2>
    </section>

    <section class="dashboard-grid">
      <div class="panel" id="absence-submit-section">
        <h3 class="panel-title">Submit Absence Request</h3>
        <input id="reason" placeholder="Reason">
        <input id="date" type="date">
        <button onclick="submitAbsence()">Submit</button>
      </div>

    </section>

    <div id="absence-review-section" class="panel">
      <h3 class="panel-title">Absence Review (Teacher/Admin)</h3>
    </div>

    <div class="panel">
      <h3 class="panel-title">Absence Requests</h3>
      <div id="absences-list"></div>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
