<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Users - WT Portal</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="role-teacher">
  <nav>
    <a href="/pages/teacher-dashboard.html">Dashboard</a>
    <a class="active" href="/pages/teacher-users.html">Users</a>
    <a href="/pages/project.html">Projects & Members</a>
    <a href="/pages/notifications.html">Notifications</a>
    <a href="/pages/absence.html">Absence</a>
    <span class="role-badge">TEACHER PORTAL</span>
    <button onclick="logout()">Logout</button>
  </nav>

  <div class="container">
    <section class="page-header">
      <h2 class="page-title">Student Login Users</h2>
      <p class="subtle">Create students and request removals for admin approval.</p>
    </section>

    <div class="panel">
      <h3 class="panel-title">Create Student Login</h3>
      <input id="teacher-student-name" placeholder="Student full name">
      <input id="teacher-student-email" placeholder="Student email">
      <input id="teacher-student-password" type="password" placeholder="Student password">
      <div class="actions">
        <button onclick="addTeacherStudentUser()">Add Student</button>
        <button class="secondary" onclick="loadTeacherStudentUsers()">Refresh Students</button>
      </div>
      <p class="subtle" id="teacher-user-msg"></p>
    </div>

    <div class="panel">
      <h3 class="panel-title">My Removal Requests</h3>
      <div id="teacher-removal-requests"></div>
    </div>

    <div class="panel">
      <h3 class="panel-title">Students</h3>
      <div id="users-list"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
