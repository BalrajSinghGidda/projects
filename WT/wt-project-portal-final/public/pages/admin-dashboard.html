<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard - WT Portal</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="role-admin">
  <nav>
    <a class="active" href="/pages/admin-dashboard.html">Dashboard</a>
    <a href="/pages/admin-users.html">Users</a>
    <a href="/pages/project.html">Project Maintenance</a>
    <a href="/pages/notifications.html">Notifications</a>
    <a href="/pages/absence.html">Absence</a>
    <span class="role-badge">ADMIN PORTAL</span>
    <button onclick="logout()">Logout</button>
  </nav>

  <div class="container">
    <section class="page-header">
      <h2 class="page-title">Admin Operations Console</h2>
    </section>

    <section class="kpi-grid" id="admin-kpi-grid">
      <div class="kpi-card">
        <span class="kpi-value" id="admin-kpi-users">-</span>
        <span class="kpi-label">Users</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-value" id="admin-kpi-projects">-</span>
        <span class="kpi-label">Projects</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-value" id="admin-kpi-pending">-</span>
        <span class="kpi-label">Pending Absences</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-value" id="admin-kpi-deadlines">-</span>
        <span class="kpi-label">Open Deadlines</span>
      </div>
    </section>

    <div class="panel">
      <div class="actions">
        <button onclick="loadAllProjects()">Projects</button>
        <button onclick="loadAbsences()">Absences</button>
        <button onclick="loadDeadlines()">Deadlines</button>
        <button onclick="loadDashboardStats()">Refresh KPIs</button>
      </div>
      <div id="output"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
