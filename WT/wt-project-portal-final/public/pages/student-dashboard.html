<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Dashboard - NexusEdu</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="role-student">
  <nav>
    <a class="active" href="/pages/student-dashboard.html">Dashboard</a>
    <a href="/pages/project.html">My Projects</a>
    <a href="/pages/notifications.html">Notifications</a>
    <a href="/pages/absence.html">Absence</a>
    <span class="role-badge">STUDENT PORTAL</span>
    <button onclick="logout()">Logout</button>
  </nav>

  <div class="container">
    <section class="page-header">
      <h2 class="page-title">Student Workspace</h2>
    </section>

    <div class="panel">
      <h3 class="panel-title">My Account</h3>
      <input id="my-display-name" placeholder="New display name">
      <button onclick="updateMyDisplayName()">Update My Name</button>

      <input id="my-current-password" type="password" placeholder="Current password">
      <input id="my-new-password" type="password" placeholder="New password">
      <button onclick="changeMyPassword()">Change My Password</button>
      <p class="subtle" id="my-account-msg"></p>
    </div>

    <div class="panel">
      <div class="actions">
        <button onclick="loadMyProjects()">My Projects</button>
        <button onclick="loadNotifications()">Notifications</button>
      </div>
      <div id="output"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
